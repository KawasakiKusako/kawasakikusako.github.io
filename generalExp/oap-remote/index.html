<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OAP 远程控制</title>
<style>
  :root {
    --bg1: #eef1f7; --bg2: #e2e8f2;
    --card: #ffffff; --line: #e6e8ee;
    --fg: #17181c; --muted: #8a8f9c;
    --accent: #4f7cff; --ink: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #101216; --bg2: #171a20;
      --card: #1c1f26; --line: #2a2e37;
      --fg: #f0f1f4; --muted: #8b909c;
      --ink: #f0f1f4;
    }
    .msg.ai { background: #22252d !important; border-color: #2a2e37 !important; }
    input.cell, select, #text, #searchInput, .chip, .proj, .attbtn, .attchip { background: #22252d !important; border-color: #2a2e37 !important; color: var(--fg) !important; }
    .logo, .avatar { background: #22252d !important; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei UI', -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--fg); min-height: 100vh;
    display: flex; flex-direction: column;
    max-width: 560px; margin: 0 auto; padding: 14px 14px calc(env(safe-area-inset-bottom) + 10px);
  }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 2px 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); overflow: hidden; flex-shrink: 0;
  }
  .logo img { width: 26px; height: 26px; }
  .htexts { flex: 1; min-width: 0; }
  .htexts b { font-size: 16px; }
  .htexts .sub { font-size: 11px; color: var(--muted); }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 999px; flex-shrink: 0;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c3c7cf; }
  .dot.on { background: #18a058; box-shadow: 0 0 0 3px rgba(24,160,88,.15); }
  .dot.err { background: #e54d2e; }
  .dot.wait { background: #e8a13c; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .card h2 { font-size: 13px; margin-bottom: 10px; color: var(--fg); }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
  .cells { display: flex; gap: 8px; justify-content: center; margin: 6px 0 14px; }
  input.cell {
    width: 44px; height: 54px; text-align: center; font-size: 24px; font-weight: 700;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg1);
    color: var(--fg); outline: none; transition: border-color .15s;
  }
  input.cell:focus { border-color: var(--accent); }
  button {
    border: none; border-radius: 12px; padding: 12px 18px; font-size: 14px; font-weight: 600;
    background: var(--ink); color: #fff; cursor: pointer; transition: opacity .15s;
  }
  button:disabled { opacity: .35; }

  .projbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .proj {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font-size: 13px; cursor: pointer; overflow: hidden;
  }
  .proj .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .newbtn {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    background: var(--ink); color: #fff; border: none; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; cursor: pointer;
  }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; font-size: 11px; color: var(--muted); cursor: pointer; max-width: 46vw;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(79,124,255,.08); }
  .chip b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 22vw; }

  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 2px; min-height: 200px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 26px; height: 26px; border-radius: 8px; background: #fff;
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .avatar img { width: 18px; height: 18px; }
  .msg {
    max-width: 78%; padding: 9px 13px; border-radius: 16px;
    font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .msg.me { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .msg.ai { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .msg.sys { align-self: center; font-size: 11px; color: var(--muted); background: none; padding: 0; }
  .typing::after { content: '●'; animation: blink 1s infinite; color: var(--accent); margin-left: 2px; }
  @keyframes blink { 50% { opacity: .2; } }
  .err { color: #e54d2e; }
  .att { font-size: 10px; opacity: .8; margin-top: 4px; }

  #composerCard { padding: 12px; }
  .crow { display: flex; gap: 8px; align-items: flex-end; }
  #text {
    flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 11px 14px; font-size: 14px; outline: none; background: var(--bg1); color: var(--fg);
    max-height: 120px; resize: none; font-family: inherit;
  }
  #text:focus { border-color: var(--accent); }
  #sendBtn {
    width: 46px; height: 46px; border-radius: 14px; padding: 0; flex-shrink: 0;
    background: var(--accent); font-size: 18px;
  }
  .attrow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .attchip {
    display: flex; align-items: center; gap: 5px; font-size: 10px;
    background: var(--bg1); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
  }
  .attchip button { background: none; color: var(--muted); padding: 0; font-size: 11px; width: auto; }
  .attbtn {
    width: 40px; height: 46px; border-radius: 14px; padding: 0; flex-shrink: 0;
    background: var(--bg1); color: var(--muted); border: 1.5px solid var(--line); font-size: 17px;
  }
  .hidden { display: none !important; }
  .foot { text-align: center; font-size: 10px; color: var(--muted); padding: 8px 0 2px; }

  .sheet-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--card); border-radius: 20px 20px 0 0;
    max-height: 75vh; display: flex; flex-direction: column;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px);
  }
  .sheet .shead { display: flex; align-items: center; margin-bottom: 10px; }
  .sheet .shead b { font-size: 14px; }
  .sheet .shead button { width: auto; background: none; color: var(--muted); padding: 4px 8px; font-size: 16px; }
  .sheet input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 13px; outline: none; background: var(--bg1); color: var(--fg); margin-bottom: 8px; }
  .sheet .opts { overflow-y: auto; }
  .sheet .opt {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 11px 10px; border-radius: 10px; background: none; color: var(--fg);
    font-size: 13px; text-align: left; cursor: pointer; border: none; font-weight: 400;
  }
  .sheet .opt:hover { background: var(--bg1); }
  .sheet .opt .od { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .opt .check { color: var(--accent); font-weight: 700; }
</style>
</head>

  function connect() {
    if (!ipv6) return;
    var url = 'wss://[' + ipv6 + ']:11414';
    setStatus('连接中…', 'wait');
    try { ws = new WebSocket(url); } catch (e) { setStatus('连接失败：' + e.message, 'err'); return; }
    ws.onopen = function () {
      setStatus(urlCode ? '已连接，自动配对中…' : '已连接，输入配对码', 'wait');
      if (urlCode) setTimeout(function () { send({ type: 'pair', code: urlCode }); }, 400);
    };
    ws.onerror = function () {
      if (!paired) {
        // 一键信任引导：跳转自签证书页（用户点「高级→继续前往」一次即可）
        var st = document.getElementById('stText');
        st.innerHTML = '';
        var a = document.createElement('a');
        a.href = 'https://[' + ipv6 + ']:11414';
        a.target = '_blank';
        a.style.cssText = 'color:#e54d2e;text-decoration:underline';
        a.textContent = '首次使用：点此信任证书（打开后选「高级→继续前往」），再回本页重连';
        st.appendChild(a);
        stDot.className = 'dot err';
      }
    };
    ws.onclose = function () {
      if (paired) { paired = false; setStatus('连接已断开', 'err'); }
      // 未配对断开：保留信任引导（由 onerror 写入），不覆盖
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'pair') {
        if (msg.ok) {
          paired = true;
          setStatus('已配对', 'on');
          document.getElementById('pairCard').classList.add('hidden');
          document.getElementById('mainUI').classList.remove('hidden');
          send({ action: 'project.list' });
          send({ action: 'agents.list' });
          send({ action: 'chat.providers' });
          send({ action: 'skills.list' });
        } else {
          setStatus(msg.error || '配对失败', 'err');
          shakeCells();
        }
        return;
      }
      if (msg.action === 'project.list') { state.projects = msg.projects || []; return; }
      if (msg.action === 'agents.list') { state.agents = (msg.agents || []).filter(function (a) { return a.available !== false; }); return; }
      if (msg.action === 'chat.providers') { state.providers = msg.providers || []; return; }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // ===== 底部选择面板 =====
  var sheet = document.getElementById('sheet');
  var mask = document.getElementById('sheetMask');
  var searchInput = document.getElementById('searchInput');
  var optsEl = document.getElementById('sheetOpts');
  function openSheet(title, opts, onPick, searchable) {
    document.getElementById('sheetTitle').textContent = title;
    optsEl.innerHTML = '';
    searchInput.classList.toggle('hidden', !searchable);
    searchInput.value = '';
    var render = function (filter) {
      optsEl.innerHTML = '';
      opts.filter(function (o) { return !filter || o.label.toLowerCase().indexOf(filter.toLowerCase()) >= 0; })
        .forEach(function (o) {
          var b = document.createElement('button');
          b.className = 'opt';
          b.innerHTML = '<span class="od">' + o.label + '</span>' + (o.active ? '<span class="check">✓</span>' : '');
          b.onclick = function () { closeSheet(); onPick(o); };
          optsEl.appendChild(b);
        });
    };
    render('');
    searchInput.oninput = function () { render(searchInput.value); };
    sheet.classList.remove('hidden');
    mask.classList.remove('hidden');
  }
  function closeSheet() { sheet.classList.add('hidden'); mask.classList.add('hidden'); }
  document.getElementById('sheetClose').onclick = closeSheet;
  mask.onclick = closeSheet;

  // ===== 工具 chips =====
  document.getElementById('chipAgent').onclick = function () {
    openSheet('选择 Agent', state.agents.map(function (a) {
      return { id: a.id, label: a.name + '（' + a.id + '）', active: a.id === state.agentId };
    }), function (o) {
      state.agentId = o.id;
      document.getElementById('agentLabel').textContent = o.label.split('（')[0];
    }, true);
  };
  document.getElementById('chipModel').onclick = function () {
    var opts = [];
    state.providers.forEach(function (p) {
      (p.models && p.models.length ? p.models : [p.model]).forEach(function (m) {
        if (!m) return;
        opts.push({ id: p.id + '::' + m, label: p.id + ' · ' + m, providerId: p.id, model: m,
          active: state.providerId === p.id && state.model === m });
      });
    });
    openSheet('选择模型', opts, function (o) {
      state.providerId = o.providerId;
      state.model = o.model;
      document.getElementById('modelLabel').textContent = o.providerId + ' · ' + o.model;
    }, true);
  };
  document.getElementById('chipThinking').onclick = function () {
    openSheet('思考强度', THINKING.map(function (t) {
      return { id: t, label: t === 'off' ? '关闭' : t, active: t === state.thinking };
    }), function (o) {
      state.thinking = o.id;
      document.getElementById('thinkingLabel').textContent = o.label;
    });
  };
  document.getElementById('chipPerm').onclick = function () {
    openSheet('权限模式', PERMS.map(function (pm) {
      return { id: pm.id, label: pm.label, active: pm.id === state.permissionMode };
    }), function (o) {
      state.permissionMode = o.id;
      document.getElementById('permLabel').textContent = o.label;
    });
  };
  document.getElementById('chipSkill').onclick = function () {
    var opts = [{ id: '', label: '不启用技能', active: !state.skill }].concat(
      (state.skills || []).map(function (s) {
        return { id: s, label: '/' + s, active: state.skill === s };
      })
    );
    openSheet('技能（强制注入）', opts, function (o) {
      state.skill = o.id;
      document.getElementById('skillLabel').textContent = o.id ? '/' + o.id : '技能';
      document.getElementById('chipSkill').classList.toggle('active', !!o.id);
    });
  };
  document.getElementById('chipKb').onclick = function () {
    send({ action: 'knowledge.list' });
    setTimeout(function () {
      openSheet('知识库来源（点击多选）', (state.kbSources || []).map(function (s) {
        return { id: s, label: s, active: state.knowledgeSources.indexOf(s) >= 0 };
      }), function (o) {
        var i = state.knowledgeSources.indexOf(o.id);
        if (i >= 0) state.knowledgeSources.splice(i, 1);
        else state.knowledgeSources.push(o.id);
        document.getElementById('kbLabel').textContent =
          state.knowledgeSources.length ? '知识库 · ' + state.knowledgeSources.length : '知识库';
        document.getElementById('chipKb').classList.toggle('active', state.knowledgeSources.length > 0);
      });
    }, 400);
  };

  // ===== 项目查找/选择 + 新建对话 =====
  document.getElementById('projBtn').onclick = function () {
    openSheet('查找项目', (state.projects || []).map(function (p) {
      return { id: p.id, label: p.name + (p.description ? ' · ' + p.description : ''), projectId: p.id,
        active: p.id === state.projectId };
    }), function (o) {
      state.projectId = o.projectId;
      state.projectName = o.label.split(' · ')[0];
      state.sessionId = null;
      document.getElementById('projName').textContent = state.projectName;
      send({ action: 'project.select', projectId: o.projectId });
    }, true);
  };
  document.getElementById('newSessionBtn').onclick = function () {
    send({ action: 'session.new' });
  };

  // ===== 附件 =====
  document.getElementById('attBtn').onclick = function () {
    document.getElementById('fileInput').click();
  };
  document.getElementById('fileInput').onchange = function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    var remaining = files.length;
    if (!remaining) return;
    files.forEach(function (f) {
      f.text().then(function (content) {
        state.attachments.push({ name: f.name, content: content });
      }).catch(function () {
        state.attachments.push({ name: f.name, content: '' });
      }).finally(function () {
        remaining--;
        if (remaining === 0) { renderAtts(); e.target.value = ''; }
      });
    });
  };
  function renderAtts() {
    var row = document.getElementById('attRow');
    row.innerHTML = '';
    row.classList.toggle('hidden', state.attachments.length === 0);
    state.attachments.forEach(function (a, i) {
      var chip = document.createElement('span');
      chip.className = 'attchip';
      chip.textContent = '📄 ' + a.name + ' ';
      var x = document.createElement('button');
      x.textContent = '✕';
      x.onclick = function () { state.attachments.splice(i, 1); renderAtts(); };
      chip.appendChild(x);
      row.appendChild(chip);
    });
  }

  // ===== 发送 =====
  document.getElementById('sendBtn').onclick = function () {
    var input = document.getElementById('text');
    var text = input.value.trim();
    if (!text && state.attachments.length === 0) return;
    addMsg('me', text || '(附件)', state.attachments);
    input.value = '';
    input.style.height = 'auto';
    var atts = state.attachments.slice();
    state.attachments = [];
    renderAtts();
    if (text.indexOf('exec:') === 0) {
      send({ action: 'exec:' + text.slice(5).trim() });
    } else {
      send({
        action: 'chat.send',
        text: text,
        attachments: atts,
        agentId: state.agentId,
        providerId: state.providerId || undefined,
        model: state.model || undefined,
        thinking: state.thinking,
        permissionMode: state.permissionMode,
        skill: state.skill || undefined,
        knowledgeSources: state.knowledgeSources.length ? state.knowledgeSources : undefined,
      });
    }
  };
  var textEl = document.getElementById('text');
  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('sendBtn').click();
    }
  });
  textEl.addEventListener('input', function () {
    textEl.style.height = 'auto';
    textEl.style.height = Math.min(textEl.scrollHeight, 120) + 'px';
  });

  // ===== 配对码 =====
  var cells = Array.prototype.slice.call(document.querySelectorAll('input.cell'));
  cells.forEach(function (cell, i) {
    cell.addEventListener('input', function () {
      cell.value = cell.value.replace(/\D/g, '').slice(0, 1);
      if (cell.value && i < cells.length - 1) cells[i + 1].focus();
      if (cells.every(function (c) { return c.value.length === 1; })) doPair();
    });
    cell.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !cell.value && i > 0) cells[i - 1].focus();
    });
    cell.addEventListener('paste', function (e) {
      e.preventDefault();
      var digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      digits.split('').forEach(function (d, j) { if (cells[j]) cells[j].value = d; });
      if (digits.length === 6) doPair();
      else cells[Math.min(digits.length, 5)].focus();
    });
  });
  function shakeCells() {
    cells.forEach(function (c) { c.value = ''; });
    cells[0].focus();
  }
  function doPair() {
    var code = cells.map(function (c) { return c.value; }).join('');
    if (!/^\d{6}$/.test(code)) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) connect();
    setTimeout(function () { send({ type: 'pair', code: code }); }, 300);
  }
  document.getElementById('pairBtn').onclick = doPair;

  if (ipv6) connect();
  else cells[0].focus();
})();
</script>
</body>
</html>
